name: supply chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo:
    name: Rust advisories, licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - name: Audit Rust dependencies
        run: |
          cargo audit --file coordinator/Cargo.lock
          (cd coordinator && cargo deny check advisories licenses bans sources)

  npm:
    name: Production npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked npm dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Audit production npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Python runtime and development dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Audit locked development dependency inputs and project runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip_audit -r requirements-dev.txt
