name: supply chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo:
    name: Rust advisories, licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - name: Audit Rust dependencies
        run: |
          # RUSTSEC-2023-0071 is narrowly accepted for WebAuthn public-key verification; rationale and limits in DECISIONS.md and threat-model.md.
          cargo audit --ignore RUSTSEC-2023-0071 --file coordinator/Cargo.lock
          (cd coordinator && cargo deny check advisories licenses bans sources)

  npm:
    name: Production npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked npm dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Audit production npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Python runtime and development dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Audit locked development dependency inputs and project runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip_audit -r requirements-dev.txt
