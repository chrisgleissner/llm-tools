name: test

on:
  # Branches run through their pull request only; a push to a branch with an open pull request
  # would otherwise start a second, identical run that competes for the same (scarce) macOS runners.
  push:
    branches: [main]
  pull_request:

# One run per pull request (or per ref on main); a newer commit cancels the run it supersedes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    # This job runs the repository's code, so it gets no OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tmux for native terminal integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux
          command -v tmux
          tmux -V

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-xdist==3.8.0 coverage

      - name: Byte-compile every module with this interpreter
        run: python -m compileall -q -f llm_tools scripts tests docs

      - name: Check installed Bridge entry point
        run: |
          cd "$(mktemp -d)"
          llm-bridge --help >/dev/null
          llm-bridge mission create --help >/dev/null
          # Without a terminal the home screen prints help and exits 2 (see _home_screen_blocker).
          status=0
          llm-bridge </dev/null >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 2 ]; then echo "::error::llm-bridge without a TTY exited $status, expected 2"; exit 1; fi

      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: coordinator
          shared-key: x86-64-linux
          save-if: ${{ matrix.python-version == '3.11' }}
      - name: Build the Rust coordinator for cross-component tests
        run: cargo build --locked --manifest-path coordinator/Cargo.toml

      # Coverage is measured on the primary Python version (3.11) only; the other versions run the same
      # suite without it. The suite runs in parallel (pytest-xdist). Each xdist worker is a separate
      # process, so COVERAGE_PROCESS_START makes sitecustomize.py start measurement in the workers (as it
      # does for CLI subprocesses); `coverage combine` merges the per-process data files.
      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        env:
          BRIDGE_REQUIRE_COORDINATOR: "1"
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: |
          python -m coverage run -m pytest -n auto
          python -m coverage combine
          python -m coverage report --fail-under=85
          python -m coverage report --include='llm_tools/bridge*.py,llm_tools/terminal.py' --fail-under=90
          python -m coverage xml

      - name: Run tests without coverage
        if: matrix.python-version != '3.11'
        env:
          BRIDGE_REQUIRE_COORDINATOR: "1"
        run: python -m pytest -n auto

      - name: Keep the coverage report for the upload job
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  coordinator:
    name: coordinator (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: coordinator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: coordinator
          shared-key: x86-64-linux
      - name: Format, lint and test
        run: |
          cargo fmt --check
          cargo run --locked --bin openapi > /tmp/openapi.json
          diff -u ../docs/distributed/openapi.json /tmp/openapi.json
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # The browser tests took 37 to 43 minutes on main in one job (limit 45): they run as two Playwright shards in parallel. Shard 1 keeps the job name
  # that was there before; shard 2 adds " shard 2" and also runs the visual regression step.
  web:
    name: web UI (TypeScript, Playwright)${{ matrix.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/2"
            suffix: ""
            artifact: web-playwright
          - shard: "2/2"
            suffix: " shard 2"
            artifact: web-playwright-shard-2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the Python worker for the end-to-end worker test
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: coordinator
          shared-key: x86-64-linux-release
      - name: Build the coordinator
        run: cargo build --locked --release --manifest-path coordinator/Cargo.toml
      - name: Type-check and build the web interface
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Browser tests (official Playwright image)
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # The layout, accessibility and timing specs of PRD-037 measure text and boxes, so they are calibrated for the fonts of the Playwright
          # image and cannot pass on a runner with other fonts. The image has no Python and no tmux: the worker and terminal specs get a venv
          # (the project, installed editable) and tmux inside the container. The screenshot comparison is a step of its own below.
          version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --ipc=host -e CI=1 -e BRIDGE_SKIP_VISUAL=1 -e SHARD -e CARGO_TARGET_DIR=/work/coordinator/target \
            -v "$GITHUB_WORKSPACE":/work -w /work/web "mcr.microsoft.com/playwright:v${version}-noble" bash -ec '
              apt-get update -qq
              apt-get install -y -qq tmux python3-venv > /dev/null
              python3 -m venv --clear /work/.venv
              /work/.venv/bin/python -m pip install -q -e /work
              /work/.venv/bin/python -c "import llm_tools"
              playwright="node node_modules/@playwright/test/cli.js test"
              # Behaviour, layout, accessibility and mobile tests on all four projects.
              $playwright --shard="$SHARD" --project=chromium-desktop --project=chromium-mobile --project=firefox-desktop --project=firefox-mobile
              # PRD-037 T45: the device matrix (nine viewports, Chromium): fold budgets, reflow, target sizes, axe and keyboard simulation at
              # 2560x1440, 1280x720, 768x1024, 1024x768, 430x932, 360x640, 320x568 and the landscape phones 740x360 and 568x320.
              $playwright --shard="$SHARD" --project="matrix-*"
              # PRD-037 UXR-043 to UXR-046: the inventoried operator tasks (interaction counts), typing above a keyboard that covers half the
              # screen, and thumb reach, at 320x568 and 360x640 (the same specs run at 1440x900 and 353x745 above).
              $playwright --shard="$SHARD" --project="paths-*"
            '
      - name: Visual regression (official Playwright image, Chromium desktop and Pixel 4)
        if: matrix.shard == '2/2'
        working-directory: web
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --ipc=host -e CI=1 -e CARGO_TARGET_DIR=/work/coordinator/target \
            -v "$GITHUB_WORKSPACE":/work -w /work/web "mcr.microsoft.com/playwright:v${version}-noble" \
            node node_modules/@playwright/test/cli.js test e2e/screenshots.spec.ts e2e/redesign/uxr-baselines.spec.ts --project=chromium-desktop --project=chromium-mobile
      - name: Keep the Playwright report and the load measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            web/playwright-report
            web/test-results/load-metrics.json
            web/test-results/**/*-actual.png
            web/test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 14

  # PRD-037 T37: Lighthouse (mobile preset) on the Inbox, Missions and a mission page of a seeded coordinator and worker.
  web-lighthouse:
    name: web UI Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the Python worker
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: coordinator
          shared-key: x86-64-linux-release
      - name: Build the coordinator
        run: cargo build --locked --release --manifest-path coordinator/Cargo.toml
      - name: Run Lighthouse
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --project=lighthouse
      - name: Keep the Lighthouse results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-lighthouse
          path: web/test-results/lighthouse
          if-no-files-found: ignore
          retention-days: 14

  # PRD-007 soak (scaled down) and PRD-008 fault injection against the release coordinator. The soak
  # here runs 5 minutes with 3 workers and 10 missions: the same harness as the nightly 30-minute and
  # long runs (soak-nightly.yml), small enough to give a result within a pull request's wait. Fault
  # injection runs every fault of scripts/bridge_chaos.py, including slow-link (DOG-019: a 300 ms RTT,
  # 1 Mbit/s link held for 180 s; the nightly run holds it for 30 minutes). docs/distributed/soak-and-chaos.md
  # has the pass criteria, the bounds and the reason for these sizes. Linux only: it reads /proc.
  soak-chaos:
    name: distributed soak (5 min) and fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: coordinator
          shared-key: x86-64-linux-release
      - name: Install tmux (the slow-link case opens remote terminals)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux
          tmux -V
      - name: Build the release coordinator
        run: cargo build --locked --release --manifest-path coordinator/Cargo.toml
      - name: Soak, scaled down (5 minutes, 3 workers, 10 missions)
        run: |
          mkdir -p out
          python scripts/bridge_soak.py --duration 300 --workers 3 --missions 10 --sample-seconds 15 --report out/soak-report.json
      - name: Fault injection
        if: always()
        run: |
          mkdir -p out
          python scripts/bridge_chaos.py --report out/chaos-report.json
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-chaos-reports
          path: out
          if-no-files-found: warn
          retention-days: 14

  # Static type check of the Bridge modules (llm_tools/bridge*.py and terminal.py; see [tool.mypy] in
  # pyproject.toml). mypy is a development tool and is not a runtime dependency.
  typecheck:
    name: mypy (Bridge modules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . mypy==2.4.1

      - name: Run mypy
        run: python -m mypy

  # Only this job can request an OIDC token. It runs no repository code: it
  # downloads the reports the test jobs produced and hands them to Codecov.
  # Pull requests from forks get no OIDC token, so they are skipped.
  coverage-upload:
    name: upload coverage
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-reports

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage-reports/coverage-3.11/coverage.xml
          fail_ci_if_error: true

  # Native ARM64 (GitHub-hosted ubuntu-24.04-arm, Cobalt 100). This is not a Raspberry Pi: the
  # figures show behaviour on the arm64 architecture and under Pi-like limits, not Pi speed.
  arm64-coordinator:
    name: ARM64 coordinator (lint, tests, Python integration)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: coordinator
          shared-key: arm64-linux
      - name: Show the platform
        run: |
          uname -m
          rustc --version --verbose
      - name: Format, lint and test the coordinator
        working-directory: coordinator
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the release coordinator
        run: cargo build --locked --release --manifest-path coordinator/Cargo.toml
      - name: Install tmux and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-xdist==3.8.0
      - name: Python suite (including the distributed integration tests) against the ARM64 binary
        env:
          BRIDGE_REQUIRE_COORDINATOR: "1"
          BRIDGE_COORDINATOR_BIN: ${{ github.workspace }}/coordinator/target/release/bridge-coordinator
        run: |
          file "$BRIDGE_COORDINATOR_BIN"
          python -m pytest -q -n auto

  arm64-container:
    name: ARM64 container (build, smoke, limits)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BRIDGE_PORT: "18443"
      COMPOSE_PROJECT_NAME: bridgeci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install cargo-zigbuild and zig
        run: python -m pip install cargo-zigbuild ziglang
      - uses: ./.github/actions/rust-toolchain
      - name: Build the linux/arm64 image (host architecture only)
        # container/build.sh builds both architectures' binaries from a git archive of HEAD and loads
        # the image for this host's architecture (--load, the default); the amd64 binary is only
        # cross-compiled here, not run. rust-toolchain.toml installs both musl targets.
        run: container/build.sh --load --tag llm-bridge-coordinator:latest
      - name: Image architecture and size
        run: |
          docker image inspect llm-bridge-coordinator:latest -f '{{.Architecture}} {{.Size}} bytes'
          test "$(docker image inspect llm-bridge-coordinator:latest -f '{{.Architecture}}')" = arm64
      - name: Container smoke test
        run: |
          {
            echo "## ARM64 container smoke test (GitHub-hosted runner)"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY" deploy/ci/container-check.sh smoke
      - name: Container under a 96 MiB limit (login burst)
        run: |
          mkdir -p out
          {
            echo "## ARM64 container under memory limits (login burst, 200 concurrent GETs)"
            echo
            echo "| Limit | Result |"
            echo "|---|---|"
          } | tee -a "$GITHUB_STEP_SUMMARY" out/container-limits.md
          for limit in 96m 64m 48m; do
            BRIDGE_MEMORY_LIMIT=$limit SUMMARY_FILE="$PWD/out/limit-$limit.md" deploy/ci/container-check.sh pressure
            tee -a "$GITHUB_STEP_SUMMARY" out/container-limits.md <"out/limit-$limit.md"
          done
      - name: Measurement harness within 512 MB and one CPU
        run: |
          sudo apt-get install --no-install-recommends -y jq
          deploy/ci/bench-limited.sh out/bench-limited.md
      - name: Assemble bench-arm64.md
        if: always()
        run: |
          {
            echo "# GitHub-hosted ARM64 runner (not a Pi)"
            echo
            echo "Runner: $(uname -m), $(nproc) CPUs, $(awk '/MemTotal/ { printf "%.1f GiB", $2 / 1048576 }' /proc/meminfo) RAM, $(. /etc/os-release; echo "$PRETTY_NAME"), kernel $(uname -r)."
            echo "Commit: $GITHUB_SHA"
            echo
            echo "## Measurement harness, 512 MB and 1 CPU"
            echo
            cat out/bench-limited.md 2>/dev/null || echo "not produced"
            echo
            echo "## Container limits"
            echo
            cat out/container-limits.md 2>/dev/null || echo "not produced"
          } >bench-arm64.md
          cat bench-arm64.md
          { echo; cat bench-arm64.md; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-arm64
          path: bench-arm64.md
          if-no-files-found: warn
          retention-days: 30

  # macOS (ARM64 and Intel) and Windows (x86-64 and ARM64) on GitHub-hosted runners. Each job builds
  # the coordinator natively (clippy with warnings denied, unit and integration tests, release build)
  # and runs the Python suite against that binary. Labels: macos-latest is Apple silicon;
  # macos-15-intel is the Intel image GitHub still offers; windows-11-arm is available to public
  # repositories. Windows supports only the coordinator and the remote client
  # (docs/distributed/DECISIONS.md D8, install.md "Windows"), so the Windows jobs run the allowlist in
  # WINDOWS_TESTS below instead of the whole suite.
  cross-platform:
    name: ${{ matrix.name }} (coordinator, Python)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS ARM64, os: macos-latest, exe: "", tmpdir: /tmp }
          - { name: macOS Intel, os: macos-15-intel, exe: "", tmpdir: /tmp }
          - { name: Windows x86-64, os: windows-latest, exe: ".exe", tmpdir: "" }
          - { name: Windows ARM64, os: windows-11-arm, exe: ".exe", tmpdir: "" }
    defaults:
      run:
        shell: bash
    env:
      # macOS temp directories are long (/private/var/folders/...) and exceed the 104-byte AF_UNIX
      # path limit that tmux and the sampler sockets hit; a short TMPDIR keeps pytest paths below it.
      TMPDIR: ${{ matrix.tmpdir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Show the platform
        run: |
          uname -sm
          python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
          command -v rustup cargo clang || true
      - name: Install LLVM (ring needs clang on Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            choco install llvm -y --no-progress
          fi
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: coordinator
          shared-key: ${{ matrix.os }}
      - name: Lint, test and build the coordinator
        working-directory: coordinator
        run: |
          rustc --version --verbose
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tmux
          tmux -V
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Python suite against the native coordinator
        if: runner.os != 'Windows'
        env:
          BRIDGE_REQUIRE_COORDINATOR: "1"
          BRIDGE_COORDINATOR_BIN: ${{ github.workspace }}/coordinator/target/release/bridge-coordinator${{ matrix.exe }}
        run: python -m pytest -q
      # The tests for the components Windows supports: Windows policy, remote CLI, worker protocol,
      # WebSocket client, the store-independent part of the command layer, and coordinator integration.
      # The step fails when an entry names a file that does not exist.
      - name: Python tests for the Windows components against the native coordinator
        if: runner.os == 'Windows'
        env:
          BRIDGE_REQUIRE_COORDINATOR: "1"
          BRIDGE_COORDINATOR_BIN: ${{ github.workspace }}/coordinator/target/release/bridge-coordinator${{ matrix.exe }}
          WINDOWS_TESTS: >-
            tests/test_windows_policy.py
            tests/test_bridge_remote.py
            tests/test_bridge_protocol.py
            tests/test_bridge_ws.py
            tests/test_bridge_commands.py::test_catalog_lists_every_operation_with_typed_parameters
            tests/test_bridge_commands.py::test_request_json_round_trip_and_strict_decoding
            tests/test_bridge_commands.py::test_error_mapping_is_stable
            tests/test_distributed_integration.py
        run: |
          missing=0
          for entry in $WINDOWS_TESTS; do
            file="${entry%%::*}"
            if [ ! -f "$file" ]; then echo "::error::WINDOWS_TESTS names a missing file: $file"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          python -m pytest -q $WINDOWS_TESTS

  # The browser suite on the other desktop platforms, against the coordinator built there. Chromium and
  # Firefox only (WebKit is optional). Visual baselines are Linux-only (web/playwright.config.ts).
  web-cross:
    name: web UI ${{ matrix.name }} (Playwright)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS ARM64, os: macos-latest, exe: "" }
          - { name: Windows x86-64, os: windows-latest, exe: ".exe" }
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      BRIDGE_COORDINATOR_BIN: ${{ github.workspace }}/coordinator/target/release/bridge-coordinator${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: coordinator
          shared-key: ${{ matrix.os }}
      - name: Build the coordinator
        run: cargo build --locked --release --manifest-path coordinator/Cargo.toml
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - name: Type-check, build and run browser tests
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          npx playwright install chromium firefox
          npx playwright test --project=chromium-desktop --project=chromium-mobile --project=firefox-desktop --project=firefox-mobile
