name: container release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Build, publish, sign and attest coordinator image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/coordinator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned cross-build tools
        run: python -m pip install cargo-zigbuild==0.24.1 ziglang==0.17.1
      - uses: ./.github/actions/rust-toolchain
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        id: build
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          container/build.sh --push --tag "$image:${GITHUB_REF_NAME}" --metadata "$RUNNER_TEMP/build-metadata.json"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")
          test -n "$digest" && test "$digest" != null
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign image with keyless Sigstore identity
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.0
      - name: Sign published image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attach SLSA build provenance to image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install pinned Syft and verify its archive
        env:
          SYFT_VERSION: 1.57.0
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/syft.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt" \
            -o "$RUNNER_TEMP/syft-checksums.txt"
          (cd "$RUNNER_TEMP" && grep 'syft_1.57.0_linux_amd64.tar.gz$' syft-checksums.txt | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
      - name: Produce CycloneDX SBOM for the published image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: "$RUNNER_TEMP/syft $IMAGE@$DIGEST -o cyclonedx-json=container.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coordinator-container-cyclonedx-${{ github.ref_name }}
          path: container.cdx.json
          if-no-files-found: error
          retention-days: 90
