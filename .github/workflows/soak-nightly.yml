name: soak-nightly

# PRD-007 soak at the sizes the PRD names: one coordinator, 10 workers and 50 missions driven by fake
# providers. Not run for pull requests (test.yml runs a 5-minute version there). The jobs:
#
#   soak-30min  the PRD's scaled-down run (30 minutes), every night.
#   soak-long   a long run on a GitHub-hosted runner, every night. A hosted job is limited to 6 hours,
#               so the scheduled run is 4.5 hours. The full 24-hour run needs a runner without that
#               limit: start this workflow by hand (workflow_dispatch) with duration 86400 and the label of
#               a self-hosted runner. Slopes are rates, so the 4.5-hour run measures the same quantities
#               as the 24-hour one, but not effects that appear only later (for example the 7-day retention
#               of finished commands), which docs/distributed/soak-and-chaos.md lists.
#
# docs/distributed/soak-and-chaos.md describes the criteria and the bounds.

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds of load for soak-long (86400 is the full 24 hours; needs a runner without the 6-hour limit)"
        default: "16200"
      runner:
        description: "Runner label for soak-long (ubuntu-latest, or the label of a self-hosted runner)"
        default: "ubuntu-latest"

permissions:
  contents: read

concurrency:
  group: soak-nightly
  cancel-in-progress: false

jobs:
  soak-30min:
    name: soak (30 min, 10 workers, 50 missions)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: coordinator
          shared-key: x86-64-linux-release
      - name: Build the release coordinator
        run: cargo build --locked --release --manifest-path coordinator/Cargo.toml
      - name: Soak (30 minutes)
        run: |
          mkdir -p out
          python scripts/bridge_soak.py --duration 1800 --workers 10 --missions 50 --sample-seconds 60 --report out/soak-30min.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-30min-report
          path: out
          if-no-files-found: warn
          retention-days: 30

  soak-long:
    name: soak (long, 10 workers, 50 missions)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 345
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: coordinator
          shared-key: x86-64-linux-release
      - name: Build the release coordinator
        run: cargo build --locked --release --manifest-path coordinator/Cargo.toml
      - name: Soak
        env:
          SOAK_DURATION: ${{ github.event.inputs.duration || '16200' }}
        run: |
          mkdir -p out
          python scripts/bridge_soak.py --duration "$SOAK_DURATION" --workers 10 --missions 50 --sample-seconds 60 --settle-seconds 300 --report out/soak-long.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-long-report
          path: out
          if-no-files-found: warn
          retention-days: 30
