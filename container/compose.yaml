# LLM Bridge coordinator. Defaults publish only on 127.0.0.1.
# LAN access is an explicit opt-in: in .env next to this file set
#   BRIDGE_PUBLISH_ADDRESS=<host LAN address>   (or 0.0.0.0 for every interface)
#   BRIDGE_PUBLIC_NAMES=bridge.home.arpa,<host LAN address>
# BRIDGE_PUBLIC_NAMES are the names browsers and workers use; they go into the
# certificate (with localhost) and into the URLs `info` prints.
# First run:  docker compose run --rm coordinator init
# Then:       docker compose up -d
# Admin:      docker compose exec coordinator bridge-coordinator info
#             docker compose exec -T coordinator bridge-coordinator admin reset-password < new-password.txt
# Flash storage (SD cards, eMMC): add compose.low-write.yaml, see
#   docs/distributed/install.md (Low-write host).
# See docs/distributed/install.md (Container deployment).
services:
  coordinator:
    image: ${BRIDGE_IMAGE:-llm-bridge-coordinator:latest}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${BRIDGE_PUBLISH_ADDRESS:-127.0.0.1}:${BRIDGE_PORT:-8443}:8443"
    environment:
      BRIDGE_COORDINATOR_PUBLIC_NAMES: ${BRIDGE_PUBLIC_NAMES:-localhost}
      BRIDGE_COORDINATOR_PUBLIC_PORT: ${BRIDGE_PORT:-8443}
      BRIDGE_COORDINATOR_TLS_CERT_FILE: ${BRIDGE_COORDINATOR_TLS_CERT_FILE:-}
      BRIDGE_COORDINATOR_TLS_KEY_FILE: ${BRIDGE_COORDINATOR_TLS_KEY_FILE:-}
      BRIDGE_COORDINATOR_TLS_CERT_NAME: ${BRIDGE_TAILSCALE_CERT_NAME:-}
    volumes:
      - bridge-data:/data
      - tailscale-certs:/certs
    # About twice the measured peak RSS (48 MiB; docs/distributed/benchmarks.md).
    mem_limit: ${BRIDGE_MEMORY_LIMIT:-96m}
    memswap_limit: ${BRIDGE_MEMORY_LIMIT:-96m}
    pids_limit: 64
    cpus: ${BRIDGE_CPUS:-1.0}
    stop_grace_period: 15s
    # Same check as the image's HEALTHCHECK. Docker writes every result to its state directory,
    # so a flash-storage host can check less often with BRIDGE_HEALTHCHECK_INTERVAL (for example 5m).
    healthcheck:
      test: ["CMD", "/usr/local/bin/bridge-coordinator", "health"]
      interval: ${BRIDGE_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      start_period: 20s
      start_interval: 5s
      retries: 3
    # json-file with rotation is the default. compose.low-write.yaml replaces this block with
    # BRIDGE_LOG_DRIVER (default journald); the json-file size options are not valid for other drivers.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
  # Optional tailnet access and a trusted *.ts.net origin for passkeys.
  # Shares the coordinator network namespace so its HTTPS listener is reachable
  # on the tailnet without publishing another host port.
  tailscale:
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    restart: unless-stopped
    network_mode: service:coordinator
    depends_on:
      coordinator:
        condition: service_started
    env_file:
      - ${BRIDGE_TAILSCALE_ENV_FILE:-./tailscale.env}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${BRIDGE_TAILSCALE_HOSTNAME:-bridge}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-certs:/certs
      - tailscale-runtime:/var/run/tailscale
    cap_add: [NET_ADMIN, NET_RAW]
  tailscale-cert-renewer:
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until tailscale --socket=/var/run/tailscale/tailscaled.sock status >/dev/null 2>&1; do sleep 2; done;
        while :; do
          now=$$(date +%s); last=$$(cat /certs/.last-renewed 2>/dev/null || echo 0);
          if [ ! -s /certs/bridge.crt ] || [ ! -s /certs/bridge.key ] || [ $$((now - last)) -ge 5184000 ]; then
            if tailscale --socket=/var/run/tailscale/tailscaled.sock cert --cert-file=/certs/bridge.crt.next --key-file=/certs/bridge.key.next "$${BRIDGE_TAILSCALE_CERT_NAME}" &&
            chown 65532:65532 /certs/bridge.crt.next /certs/bridge.key.next &&
            chmod 0644 /certs/bridge.crt.next && chmod 0600 /certs/bridge.key.next &&
            mv -f /certs/bridge.crt.next /certs/bridge.crt &&
            mv -f /certs/bridge.key.next /certs/bridge.key; then
              date +%s > /certs/.last-renewed;
            else
              echo 'Tailscale certificate renewal failed; retrying in five minutes' >&2;
              sleep 300;
            fi;
          else
            sleep 300;
          fi;
        done
    environment:
      BRIDGE_TAILSCALE_CERT_NAME: ${BRIDGE_TAILSCALE_CERT_NAME:-}
    depends_on:
      tailscale:
        condition: service_started
    volumes:
      - tailscale-certs:/certs
      - tailscale-runtime:/var/run/tailscale
    mem_limit: 32m
    pids_limit: 16
volumes:
  bridge-data:
  tailscale-state:
  tailscale-certs:
  tailscale-runtime:
