[package]
name = "bridge-coordinator"
version = "0.1.0"
edition = "2021"
description = "LLM Bridge coordinator: indexes workers and missions, routes commands, projects events"
license = "MIT"
publish = false

[lib]
name = "bridge_coordinator"
path = "src/lib.rs"

[[bin]]
name = "bridge-coordinator"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "ws", "tokio", "json", "query", "matched-path", "original-uri"] }
# hyper + hyper-util: serve axum over our own rustls acceptor (axum-server would pull aws-lc-rs).
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"
rusqlite = { version = "0.41", features = ["bundled", "backup", "hooks"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
serde_cbor_2 = "0.13"
webauthn-rs = { version = "0.6.2", default-features = false, features = ["resident-key-support", "conditional-ui", "danger-allow-state-serialisation"] }
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

[dev-dependencies]
# Plain tungstenite client over our own tokio-rustls stream (no TLS feature, so no second crypto provider).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[patch.crates-io]
# Upstream 0.6.2 exposes resident-key registration only through its attestation-root API.
# This local one-line patch makes the normal no-attestation passkey API request discoverable keys.
webauthn-rs = { path = "vendor/webauthn-rs" }

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
