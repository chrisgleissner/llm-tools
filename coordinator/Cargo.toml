[package]
name = "bridge-coordinator"
version = "0.1.0"
edition = "2021"
description = "LLM Bridge coordinator: indexes workers and missions, routes commands, projects events"
license = "MIT"
publish = false

[lib]
name = "bridge_coordinator"
path = "src/lib.rs"

[[bin]]
name = "bridge-coordinator"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "ws", "tokio", "json", "query", "matched-path", "original-uri"] }
# hyper + hyper-util: serve axum over our own rustls acceptor (axum-server would pull aws-lc-rs).
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }

[dev-dependencies]
# Plain tungstenite client over our own tokio-rustls stream (no TLS feature, so no second crypto provider).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# reqwest with manual roots + ring only, cookie jar for the session tests.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json"] }

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
